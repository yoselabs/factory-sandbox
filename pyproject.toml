[project]
name = "factory-sandbox"
version = "0.0.1"
description = "Throwaway proving ground for the factory's unattended loop. Not a real project."
requires-python = ">=3.11"
# Deliberately empty. The whole point of this repository is that its environment cannot be the
# reason a turn failed -- no browsers, no network, no system libraries, nothing to install but
# pytest (below, as a dev dependency only).
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
